<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<title>Mirovina</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#1a1a1a;--card:#2a2a2a;--muted:#9e9e9e;--text:#fff;--blue:#bbdefb;--yellow:#fff176;--green:#9ccc65;--purple:#ce93d8;--red:#ef9a9a}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{background:var(--card);border-radius:16px;padding:36px 28px;width:100%;max-width:340px;text-align:center}
  .box h1{font-size:22px;margin-bottom:6px}.box p{color:var(--muted);font-size:13px;margin-bottom:24px}
  .box input{width:100%;background:var(--bg);border:1px solid #444;border-radius:10px;padding:12px 14px;color:#fff;font-size:16px;outline:none;margin-bottom:12px}
  .box button{width:100%;background:var(--green);color:#111;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700}
  .err{color:var(--red);font-size:13px;margin-top:10px}
  #app{display:none;padding:16px 16px 0}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  header h1{font-size:22px}
  .out{background:none;border:1px solid #444;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:10px;border-radius:12px;font-size:14px;font-weight:700;border:1px solid #444;background:none;color:var(--muted)}
  .tab.on{background:var(--blue);color:#111;border-color:var(--blue)}
  .lbl{font-size:13px;color:var(--muted)}
  .big{font-size:44px;font-weight:800;color:var(--blue);letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .c{background:var(--card);border-radius:14px;padding:12px 14px}
  .c .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .c .v{font-size:19px;font-weight:700;margin-top:4px}
  .chart{background:var(--card);border-radius:14px;padding:14px 10px 8px;margin-bottom:16px}
  .chart .lbl{padding-left:6px;margin-bottom:8px}
  .cc{position:relative;height:230px}
  .range{display:flex;gap:6px;margin-bottom:16px}
  .range button{flex:1;padding:8px;border-radius:20px;font-size:12px;border:1px solid #444;background:none;color:var(--muted)}
  .range button.on{background:#3a3a3a;color:#fff;border-color:#666}
  table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border-radius:14px;overflow:hidden}
  th{color:var(--muted);font-weight:600;padding:10px 8px;text-align:right;font-size:10px;text-transform:uppercase}
  td{padding:9px 8px;text-align:right;border-top:1px solid #383838;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}td:first-child{color:var(--muted)}
  .load{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h1>Mirovina</h1><p>Prijava</p>
  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pwd" placeholder="Lozinka" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Prijava</button><div class="err" id="err"></div>
</div></div>

<div id="app">
  <header><h1 id="title">OMO</h1><button class="out" onclick="logout()">Odjava</button></header>
  <div class="tabs"><button class="tab on" id="t-omo" onclick="sw('omo')">OMO</button><button class="tab" id="t-dmo" onclick="sw('dmo')">DMO</button></div>
  <div class="lbl">Neto vrijednost računa</div>
  <div class="big" id="net">—</div>
  <div class="sub" id="asof"></div>
  <div class="cards" id="cards"></div>
  <div class="range" id="range">
    <button class="on" onclick="setRange('all',this)">Čitavo razdoblje</button>
    <button onclick="setRange('ytd',this)">Ova godina</button>
    <button onclick="setRange('m',this)">Mjesec</button>
  </div>
  <div class="chart"><div class="lbl">Kretanje vrijednosti</div><div class="cc"><canvas id="ch"></canvas></div></div>
  <div id="tbl" class="load">Učitavanje…</div>
</div>

<script>
const SUPABASE_URL="https://xfjujgqlowjkscdgjmhu.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanVqZ3Fsb3dqa3NjZGdqbWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDY5MDcsImV4cCI6MjA5MDE4MjkwN30.sJwHqFRqBPIcxfbHo5m4LK2byv_4cHJFZsMvUf6r3as";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let all=[],tab="omo",range="all",chart=null;
const eur=v=>v==null?"—":Number(v).toLocaleString("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const pct=v=>(v>=0?"+":"")+(v*100).toFixed(2).replace(".",",")+" %";
const MJ=["Sij","Velj","Ožu","Tra","Svi","Lip","Srp","Kol","Ruj","Lis","Stu","Pro"];

async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("pwd").value});
  if(error)document.getElementById("err").textContent="Pogrešan email ili lozinka.";else show();
}
async function logout(){await sb.auth.signOut();location.reload();}
function show(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load();}
sb.auth.getSession().then(({data})=>{if(data.session)show();});

async function load(){
  const {data,error}=await sb.from("fund_data").select("*").order("date",{ascending:true});
  if(error){document.getElementById("tbl").textContent="Greška: "+error.message;return;}
  all=data;render();
}
function sw(t){tab=t;document.getElementById("t-omo").className="tab"+(t==="omo"?" on":"");document.getElementById("t-dmo").className="tab"+(t==="dmo"?" on":"");render();}
function setRange(r,btn){range=r;[...document.querySelectorAll("#range button")].forEach(b=>b.classList.remove("on"));btn.classList.add("on");renderChart();}

function get(row){ // unify fields
  return tab==="omo"
    ?{net:row.omo_val1,paid:row.omo_val2,ret:row.omo_val3,dps:null,unit:row.omo_extra2,asof:row.omo_extra1}
    :{net:row.dmo_val1,paid:row.dmo_val2,ret:row.dmo_val3,dps:row.dmo_val4,unit:row.dmo_extra2,asof:row.dmo_extra1};
}
function render(){
  if(!all.length)return;
  document.getElementById("title").textContent=tab==="omo"?"OMO – Europska mirovina":"DMO – Dobrovoljna mirovina";
  const L=get(all[all.length-1]);
  const base=L.paid+(L.dps||0);
  document.getElementById("net").textContent=eur(L.net);
  document.getElementById("asof").textContent="Stanje na dan "+L.asof;
  const cards=[["Uplaćeno",eur(L.paid),"var(--yellow)"]];
  if(L.dps!=null)cards.push(["Poticaji (DPS)",eur(L.dps),"var(--purple)"]);
  cards.push(["Prinos apsolutno",(L.ret>=0?"+":"")+eur(L.ret),L.ret>=0?"var(--green)":"var(--red)"]);
  cards.push(["Prinos relativno",pct(L.ret/base),L.ret>=0?"var(--green)":"var(--red)"]);
  cards.push(["Cijena udjela",Number(L.unit).toLocaleString("hr-HR",{minimumFractionDigits:4}),"#fff"]);
  document.getElementById("cards").innerHTML=cards.map(c=>`<div class="c"><div class="lbl">${c[0]}</div><div class="v" style="color:${c[2]}">${c[1]}</div></div>`).join("");
  renderChart();renderTable();
}
function filtered(){
  const now=new Date(all[all.length-1].date);
  return all.filter(r=>{const d=new Date(r.date);
    if(range==="ytd")return d.getFullYear()===now.getFullYear();
    if(range==="m")return (now-d)/864e5<=31;return true;});
}
function renderChart(){
  const rows=filtered();
  const labels=rows.map(r=>r.date);
  const ds=[
    {label:"Neto vrijednost",data:rows.map(r=>get(r).net),borderColor:"#bbdefb",backgroundColor:"rgba(107,107,58,.45)",fill:true,tension:.15,pointRadius:0,borderWidth:2},
    {label:"Uplaćeno",data:rows.map(r=>get(r).paid),borderColor:"#fff176",borderDash:[6,4],fill:false,tension:0,pointRadius:0,borderWidth:2}
  ];
  if(tab==="dmo")ds.push({label:"Poticaji",data:rows.map(r=>get(r).dps),borderColor:"#ce93d8",borderDash:[2,3],fill:false,pointRadius:0,borderWidth:1.5});
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById("ch"),{type:"line",data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{color:"#9e9e9e",boxWidth:10,font:{size:11}}},
      tooltip:{callbacks:{label:c=>c.dataset.label+": "+eur(c.parsed.y)}}},
    scales:{
      x:{ticks:{color:"#9e9e9e",font:{size:10},maxRotation:0,autoSkip:false,
          callback:function(v,i){const d=new Date(this.getLabelForValue(v));const prev=i>0?new Date(this.getLabelForValue(v-1)):null;
            return (!prev||prev.getMonth()!==d.getMonth())?MJ[d.getMonth()]+" '"+String(d.getFullYear()).slice(2):null;}},
         grid:{display:false}},
      y:{ticks:{color:"#9e9e9e",font:{size:10},callback:v=>v.toLocaleString("hr-HR")+" €"},grid:{color:"#3a3a3a",borderDash:[4,4]},beginAtZero:true}
    }}});
}
function renderTable(){
  const rows=[...all].reverse().slice(0,60);
  const h=tab==="omo"?["Datum","Neto","Uplaćeno","Prinos","Cij. udjela"]:["Datum","Neto","Uplaćeno","Poticaji","Prinos"];
  document.getElementById("tbl").className="";
  document.getElementById("tbl").innerHTML=`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>{const g=get(r);const c=tab==="omo"?[r.date,eur(g.net),eur(g.paid),eur(g.ret),Number(g.unit).toFixed(4)]:[r.date,eur(g.net),eur(g.paid),eur(g.dps),eur(g.ret)];
    return `<tr>${c.map(x=>`<td>${x}</td>`).join("")}</tr>`;}).join("")}</tbody></table>`;
}
</script>
</body>
</html>
